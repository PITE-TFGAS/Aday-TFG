<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Amigable</title>
  <style>
    :root {
      --primary-color: #2E7D32;
      --secondary-color: #1565C0;
      --danger-color: #C62828;
      --text-color: #333;
      --light-bg: #f5f5f5;
      --white: #ffffff;
      --shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    
    body {
      font-family: 'Arial', sans-serif;
      width: 700px;
      height: 600px;
      margin: 0;
      padding: 15px;
      font-size: 20px;
      background-color: var(--light-bg);
      color: var(--text-color);
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    
    h1 {
      font-size: 22px;
      color: var(--primary-color);
      text-align: center;
      margin: 0 0 3px 0;
      padding: 0;
    }
    
    #goalContainer {
      background-color: var(--white);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 5px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    
    #goalContainer label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 18px;
    }
    
    #userGoal {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 6px;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    
    #chatbox {
      flex-grow: 1;
      border: 2px solid #ddd;
      padding: 12px;
      margin-bottom: 10px;
      background-color: var(--white);
      border-radius: 8px;
      font-size: 18px;
      box-shadow: var(--shadow);
      overflow-y: auto;
      min-height: 200px;
    }
    
    .message {
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 6px;
      max-width: 90%;
      word-wrap: break-word;
    }
    
    .user-message {
      background-color: #E3F2FD;
      margin-left: auto;
      border-top-right-radius: 0;
    }
    
    .bot-message {
      background-color: #E8F5E9;
      margin-right: auto;
      border-top-left-radius: 0;
    }
    
    .sender {
      font-weight: bold;
      color: var(--primary-color);
    }
    
    .input-container {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    
    .button-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }
    
    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    #ttsButton {
      background-color: #6A1B9A;
      color: white;
    }

    #ttsButton::before {
      content: "🔊";
    }

    button {
      padding: 10px 5px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: var(--shadow);
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    #sendButton {
      background-color: var(--primary-color);
      color: white;
      width: 90px;
      flex-shrink: 0;
    }
    
    #resetButton {
      background-color: var(--danger-color);
      color: white;
    }
    
    #settingsButton {
      background-color: var(--secondary-color);
      color: white;
    }
    
    #resolveGoalButton {
      background-color: var(--primary-color);
      color: white;
      width: 100%;
      padding: 10px;
      font-size: 18px;
    }
    
    #userInput {
      flex-grow: 1;
      padding: 10px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
    }
    
    button:focus, input:focus {
      outline: 3px solid #FFD600;
    }
    
    button::before {
      margin-right: 5px;
      font-family: 'Arial';
    }
    
    #sendButton::before {
      content: "➤";
    }
    
    #resetButton::before {
      content: "↻";
    }
    
    #settingsButton::before {
      content: "⚙";
    }
    
    #resolveGoalButton::before {
      content: "✓";
    }

    #ttsButton.active-feature::before {
      content: "🔊 Leyendo en voz alta";
    }
    #ttsButton:not(.active-feature)::before {
      content: "🔈Leer en voz alta";
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .active-feature {
      animation: pulse 2s infinite;
      box-shadow: 0 0 0 2px var(--white), 0 0 0 4px currentColor;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }

    #goalModal {
      display: none; 
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6); 
      z-index: 1000; 
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #goalModalContent {
      background-color: var(--white);
      padding: 25px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      width: 80%;
      max-width: 500px;
      text-align: center;
    }

    #goalModal h2 {
      margin-top: 0;
      margin-bottom: 15px;
      color: var(--primary-color);
      font-size: 22px;
      font-weight: bold;
    }

    #modalGoalInput {
      width: 100%;
      padding: 12px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 6px;
      margin-bottom: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }

    #setGoalButton {
      background-color: var(--primary-color);
      color: white;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 6px;
      width: 100%;
      margin: 0 auto;
      transition: transform 0.2s, background-color 0.3s;
    }

    #setGoalButton:hover {
      background-color: #1B5E20;
    }

    #setGoalButton::before {
      content: "✓";
      margin-right: 8px;
      font-family: 'Arial';
    }

    
    #goalDisplayArea {
      display: none;
      background-color: var(--white);
      padding: 10px 15px;
      border-radius: var(--border-radius);
      margin-bottom: 10px;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    #goalDisplayText {
      font-size: 18px;
      font-weight: bold;
      color: var(--text-color);
      flex-grow: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #changeGoalButton {
      background-color: var(--secondary-color);
      color: white;
      padding: 8px 12px;
      font-size: 14px;
      flex-shrink: 0;
    }

    #changeGoalButton::before {
      content: "✎";
      margin-right: 8px;
      font-family: 'Arial';
    }

  </style>
</head>
<body>
  <h1>ISABEL</h1>

  <div id="goalDisplayArea">
    <span id="goalDisplayText"></span>
    <button id="changeGoalButton">Cambiar Objetivo</button>
  </div>

  <div id="goalModal">
    <div id="goalModalContent">
      <h2>¿En qué te puedo ayudar hoy?</h2>
      <input type="text" id="modalGoalInput" placeholder="Escribe tu objetivo (p.ej. comprar un billete de avión)">
      <button id="setGoalButton">Empezar</button>
    </div>
  </div>

  <div id="chatbox"></div>
  
  <div class="input-container">
    <input type="text" id="userInput" placeholder="Escribe tu mensaje aquí...">
    <button id="sendButton">Enviar</button>
  </div>
  
  <div class="button-container">
    <button id="ttsButton"></button>
    <div class="button-row">
      <button id="resetButton">Reiniciar</button>
      <button id="settingsButton">Ajustes</button>
    </div>
  </div>

  <template id="message-template">
    <div class="message">
      <strong class="sender"></strong>: <span class="content"></span>
    </div>
  </template>
  
  <script src="popup.js"></script>
</body>
</html>
